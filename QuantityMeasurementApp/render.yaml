services:
  - type: web
    name: quantity-measurement-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    autoDeploy: true
    envVars:
      # Database (PostgreSQL)
      - key: ConnectionStrings__DefaultConnection
        scope: run
        value: ${DATABASE_URL}
      
      # Redis
      - key: REDIS_URL
        scope: run
        value: ${REDIS_URL}
      
      # JWT Configuration
      - key: Jwt__Key
        scope: run
        value: ${JWT_KEY}
      
      - key: Jwt__Issuer
        scope: run
        value: ${JWT_ISSUER}
      
      - key: Jwt__Audience
        scope: run
        value: ${JWT_AUDIENCE}
      
      # Crypto Configuration
      - key: Crypto__Key
        scope: run
        value: ${CRYPTO_KEY}
      
      - key: Crypto__IV
        scope: run
        value: ${CRYPTO_IV}
      
      # Environment
      - key: ASPNETCORE_ENVIRONMENT
        scope: run
        value: Production
      
      # Allow listening on 0.0.0.0
      - key: ASPNETCORE_URLS
        scope: run
        value: http://0.0.0.0:8080
